vault_file: "vault.txt"
embeddings_file: "vault_embeddings.json"
ollama_model: "llama3"
top_k: 7
system_message: "You are a helpful assistant. Answer the question with ONLY a short, direct answer based on the provided context. For yes/no questions, answer with only 'yes' or 'no'. Do not include explanations."

ollama_api:
  base_url: "http://localhost:11434/v1"
  api_key: "llama3"

pipelines:
  rag:
    enable_query_rewrite: true
    rewrite_after_turn: 1

  chain_of_thought:
    reasoning_prompt: "Think step by step to answer this question."

  baseline:
    direct_answer: true
